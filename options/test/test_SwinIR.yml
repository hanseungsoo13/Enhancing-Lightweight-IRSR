name: CRG_LSwinIR_SRx4
model_type: SRModel
scale: 4
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

datasets:
  test_1:
    name: results-A #Set5
    type: PairedImageDataset
    dataroot_gt: /mnt/vc-nfs/sshan/IR_dataset/results-A/HR
    dataroot_lq: /mnt/vc-nfs/sshan/IR_dataset/results-A/LR_bicubic/X4
    filename_tmpl: '{}x4'
    io_backend:
      type: disk
  
  test_2:
    name: results-C #Set5
    type: PairedImageDataset
    dataroot_gt: /mnt/vc-nfs/sshan/IR_dataset/results-C/HR
    dataroot_lq: /mnt/vc-nfs/sshan/IR_dataset/results-C/LR_bicubic/X4
    filename_tmpl: '{}x4'
    io_backend:
      type: disk
  
  test_3:
    name: test20
    type: PairedImageDataset
    dataroot_gt: /mnt/vc-nfs/sshan/IR_dataset/M3FD/test20/M3FD_Fusion_test20/lr/HR
    dataroot_lq: /mnt/vc-nfs/sshan/IR_dataset/M3FD/test20/M3FD_Fusion_test20/lr/LR_bicubic/X4
    filename_tmpl: '{}x4'
    io_backend:
      type: disk

  test_4:
    name: test15
    type: PairedImageDataset
    dataroot_gt: /mnt/vc-nfs/sshan/IR_dataset/M3FD/test15/M3FD_Fusion_test15/lr/HR
    dataroot_lq: /mnt/vc-nfs/sshan/IR_dataset/M3FD/test15/M3FD_Fusion_test15/lr/LR_bicubic/X4
    filename_tmpl: '{}x4'
    io_backend:
      type: disk

  test_5:
    name: ir100
    type: SingleTestImageDataset
    dataroot_gt: /home/sshan/project/experiment/data/IR100
    dataroot_lq: null
    filename_tmpl: '{}x4'
    io_backend:
      type: disk

# network structures
network_g:
  type: SwinIR
  upscale: 4
  in_chans: 3
  img_size: 64
  window_size: 8
  img_range: 1.
  depths: [6, 6, 6, 6]
  embed_dim: 60
  num_heads: [6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: 'pixelshuffledirect'
  resi_connection: '1conv'


# path
path:
  pretrain_network_g: /home/sshan/project/experiment/SwinIR/model_zoo/swinir/002_lightweightSR_DIV2K_s64w8_SwinIR-S_x4.pth
  strict_load_g: true
  param_key_g: params

val:
  save_img: true
  suffix: ~  # add suffix to saved images

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true
